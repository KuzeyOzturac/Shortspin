name: Refresh video catalog
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install yt-dlp
      - run: python scripts/refresh_catalog.py
      - name: Save catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/videos.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Shortspin video catalog"
            git push
          fi
  deploy:
    needs: refresh
    uses: ./.github/workflows/pages.yml
